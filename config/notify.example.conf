# 通知中心与交互式 Telegram Bot 示例配置
# 复制为 config/notify.conf 或直接在面板「通知与 Bot」页面可视化配置

triggers=begin
[global]
# 可选触发点：
#   oci_task_succeeded  - OCI 抢购/创建任务成功
#   oci_dt_alert        - OCI 流量监控超限告警 / 自动停机
#   azure_credit_alert  - Azure 赠金/费用监控告警 / 自动动作
#   vm_change_ip        - 实例更换公网 IP 完成
#   vm_power            - 实例开机 / 关机 / 重启操作完成
#   auth_login          - 面板登录提醒 / 登录失败锁定告警
enabled_events=oci_task_succeeded,oci_dt_alert,azure_credit_alert,vm_change_ip,auth_login
triggers=end

telegram_bot=begin
[default]
enabled=false
bot_token=
api_host=https://api.telegram.org
# proxy 填写 config/proxy.conf 中的代理 ID（留空或 none 表示直连）
proxy=none
fallback=none
# 允许交互的用户 ID / 会话 ID（多个用英文逗号分隔，至少填写一项才会响应指令）
allowed_user_ids=
allowed_chat_ids=
# 开启后交互 Bot 自动推送订阅的触发点通知，无需在 notify_channel 中重复配置 TG
auto_notify=true
# 推送目标 Chat ID（留空则自动使用 allowed_chat_ids，再否则使用 allowed_user_ids）
notify_chat_ids=
notify_events=oci_task_succeeded,oci_dt_alert,azure_credit_alert,vm_change_ip,auth_login
notify_cooldown_sec=300
telegram_bot=end

notify_channel=begin
# 支持类型: bark | wecom_bot | wecom_app | feishu | telegram | pushplus | custom
# [bark-1]
# name=iPhone Bark
# type=bark
# enabled=true
# proxy=none
# fallback=none
# cooldown_sec=300
# events=oci_task_succeeded,azure_credit_alert
# param.bark_push=https://api.day.app/your_key
# param.bark_group=cloud-vm
# param.bark_sound=
#
# [feishu-1]
# name=飞书运维群
# type=feishu
# enabled=true
# proxy=none
# fallback=none
# cooldown_sec=300
# events=oci_task_succeeded,oci_dt_alert,azure_credit_alert
# param.fskey=your_feishu_webhook_key
# param.fssecret=
#
# [wecom-bot-1]
# name=企微群机器人
# type=wecom_bot
# enabled=true
# proxy=none
# fallback=none
# cooldown_sec=300
# events=oci_task_succeeded
# param.qywx_key=your_wecom_key
#
# [custom-1]
# name=自定义Webhook
# type=custom
# enabled=true
# proxy=none
# fallback=none
# cooldown_sec=300
# events=oci_task_succeeded,auth_login
# param.webhook_url=https://example.com/hook
# param.webhook_method=POST
# param.webhook_content_type=application/json
# param.webhook_body={"title":"$title","content":"$content"}
# param.webhook_headers=Authorization: Bearer xxx
notify_channel=end
